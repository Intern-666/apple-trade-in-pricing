<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Trade-In — Sign In</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    /* Scoped to this page only -- does not touch styles.css,
       so the existing customer/admin look stays untouched. */

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .auth-tabs button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    .auth-tabs button.active {
      background: #1d1d1f;
      color: white;
      border-color: #1d1d1f;
    }

    .auth-error {
      display: none;
      background: #ffebee;
      color: #b42318;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .auth-error.visible {
      display: block;
    }

    /* Portal-choice popup shown to admins right after login */

    #portal-choice-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 24px;
    }

    #portal-choice-overlay.visible {
      display: flex;
    }

    .portal-choice-modal {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .portal-choice-modal h3 {
      margin-top: 0;
    }

    .portal-choice-modal .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .portal-choice-modal button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      border: none;
    }

    #choose-customer {
      background: white;
      color: #1d1d1f;
      border: 1px solid #ccc !important;
    }

    #choose-admin {
      background: #0071e3;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Apple Trade-In Valuation</h2>

    <div class="auth-tabs">
      <button type="button" id="tab-login" class="active">Log In</button>
      <button type="button" id="tab-signup">Sign Up</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="form-group">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" required autocomplete="current-password" />
      </div>

      <button type="submit" id="loginSubmitBtn">Log In</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" class="hidden">
      <div class="form-group">
        <label for="signup-username">Choose a username</label>
        <input id="signup-username" type="text" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="signup-password">Choose a password</label>
        <input id="signup-password" type="password" required minlength="6" autocomplete="new-password" />
        <small>At least 6 characters.</small>
      </div>

      <button type="submit" id="signupSubmitBtn">Create Account</button>
    </form>
  </div>

  <!-- ADMIN PORTAL-CHOICE POPUP -->
  <div id="portal-choice-overlay">
    <div class="portal-choice-modal">
      <h3>Welcome back</h3>
      <p>Your account has admin access. Where would you like to go?</p>
      <div class="buttons">
        <button type="button" id="choose-customer">Customer Portal</button>
        <button type="button" id="choose-admin">Admin Dashboard</button>
      </div>
    </div>
  </div>

  <script>
    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const authError = document.getElementById("auth-error");

    function showError(message) {
      authError.textContent = message;
      authError.classList.add("visible");
    }

    function clearError() {
      authError.textContent = "";
      authError.classList.remove("visible");
    }

    tabLogin.addEventListener("click", () => {
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
      clearError();
    });

    tabSignup.addEventListener("click", () => {
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      clearError();
    });

    // ------------------------------------------------------------
    // LOGIN
    // ------------------------------------------------------------

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearError();

      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Login failed.");
        }

        if (data.role === "admin") {
          // Admins get to choose where to go, every login.
          document.getElementById("portal-choice-overlay").classList.add("visible");
        } else {
          window.location.href = "/";
        }
      } catch (error) {
        showError(error.message || "Unable to log in.");
      }
    });

    // ------------------------------------------------------------
    // SIGNUP
    // ------------------------------------------------------------
    // Signup always creates a "customer" account -- there is no
    // role field in this form, and the backend hardcodes the role
    // for /signup regardless of what is sent. Admin accounts are
    // created separately (see internal/auth.py / README).

    signupForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      clearError();

      const username = document.getElementById("signup-username").value.trim();
      const password = document.getElementById("signup-password").value;

      try {
        const response = await fetch("/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Sign up failed.");
        }

        // Auto-login after successful signup.
        const loginResponse = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, password }),
        });

        if (loginResponse.ok) {
          window.location.href = "/";
        } else {
          // Fall back: account was created, just ask them to log in.
          tabLogin.click();
          showError("Account created. Please log in.");
        }
      } catch (error) {
        showError(error.message || "Unable to sign up.");
      }
    });

    // ------------------------------------------------------------
    // PORTAL CHOICE (admins only)
    // ------------------------------------------------------------

    document.getElementById("choose-customer").addEventListener("click", () => {
      window.location.href = "/";
    });

    document.getElementById("choose-admin").addEventListener("click", () => {
      window.location.href = "/admin";
    });
  </script>
</body>
</html>
